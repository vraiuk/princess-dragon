<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Трофеи — Жабка</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="trophies.css">
</head>
<body class="tr">
<header class="tr-head">
  <div class="tr-title"><span class="tr-logo">🏆</span> Трофеи</div>
  <nav class="tr-tabs" role="tablist" aria-label="Разделы трофеев">
    <button role="tab" id="tab-ach" data-tab="ach" aria-controls="pane-ach" aria-selected="true">🎖️ Ачивки</button>
    <button role="tab" id="tab-stats" data-tab="stats" aria-controls="pane-stats" aria-selected="false" tabindex="-1">📊 Статистика</button>
    <button role="tab" id="tab-grave" data-tab="grave" aria-controls="pane-grave" aria-selected="false" tabindex="-1">🪦 Кладбище</button>
  </nav>
  <div class="tr-spacer"></div>
</header>
<main class="tr-main">
  <section id="pane-ach" class="tr-pane" role="tabpanel" aria-labelledby="tab-ach"></section>
  <section id="pane-stats" class="tr-pane" role="tabpanel" aria-labelledby="tab-stats" hidden></section>
  <section id="pane-grave" class="tr-pane" role="tabpanel" aria-labelledby="tab-grave" hidden></section>
</main>
<!-- настоящие DEFS для мока в браузере; в Electron данные приходят из main -->
<script src="../core.js"></script>
<script src="../achievements.js"></script>
<script src="trophies.js"></script>
</body>
</html>
