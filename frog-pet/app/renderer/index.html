<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Жабка</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="toast.css">
</head>
<body>
<div id="pet">
  <canvas id="cv" width="260" height="320"></canvas>
  <div id="bubble" class="hidden" role="status" aria-live="polite">
    <div class="txt"></div>
    <div class="tip"></div>
    <div class="btns"></div>
  </div>
  <div id="caption" class="off" aria-live="polite"></div>
  <div id="side" class="hidden">
    <button id="bDrink" class="ring" title="Я попил воды" aria-label="Отметить: стакан воды выпит">💧</button>
    <button id="bMove" class="ring" title="Я размялся" aria-label="Отметить: разминка сделана">🤸</button>
    <button id="bTrophy" class="mini" title="Трофеи и статистика" aria-label="Трофеи и статистика">🏆</button>
  </div>
</div>
<script src="../core.js"></script>
<script src="../achievements.js"></script>
<script src="../showcase.js"></script>
<script src="demo.js"></script>
<script src="toast.js"></script>
<script src="death.js"></script>
<script src="pet.js"></script>
</body>
</html>
