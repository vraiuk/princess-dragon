<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Принцесса и Дракон — бумажная сказка</title>
<meta name="description" content="Мультфильм в стиле бумажной аппликации и stop-motion: вырезанные из цветной бумаги марионетки на шплинтах, диорама слоёв, анимация на двойках. Всё рисуется на чистом JavaScript.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#2a1c16;--panel:#f3e6cc;--ink:#3a2a20;--accent:#c8435e;--muted:#8a6e58}
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font-family:'Caveat',cursive}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;
    background:#3a281e radial-gradient(ellipse at 50% 30%,#5a3e2c 0%,#2a1c16 75%)}
  .wrap{width:min(100%,calc((100vh - 170px)*16/9));display:flex;flex-direction:column;gap:12px}
  nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  nav a{font:700 22px 'Caveat',cursive;color:var(--ink);text-decoration:none;background:#f6ead2;padding:4px 16px 6px;
    box-shadow:2px 3px 0 #0005,0 0 0 1px #0002;transform:rotate(-1.2deg)}
  nav a:nth-child(2){transform:rotate(1deg)} nav a:nth-child(3){transform:rotate(-.6deg)}
  nav a:hover{background:#fff6e2}
  nav a.cur{background:var(--accent);color:#fff8ee}
  .stage{position:relative;width:100%;aspect-ratio:16/9;background:#1a100c;box-shadow:0 0 0 10px #f3e6cc,0 0 0 11px #0003,10px 18px 40px #000a}
  canvas{display:block;width:100%;height:100%;cursor:pointer}
  .big-play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9%;gap:12px;background:linear-gradient(transparent 50%,#0007);border:0;cursor:pointer}
  .big-play .btn{background:#fbf1dc;color:var(--accent);padding:6px 30px 10px;font:700 clamp(22px,3.2vw,40px) 'Caveat',cursive;box-shadow:4px 6px 0 #0006;transform:rotate(-1.5deg)}
  .big-play:hover .btn{transform:rotate(-1.5deg) translateY(-3px)}
  .big-play[hidden]{display:none}
  .big-play:disabled{cursor:wait}
  .controls{display:flex;align-items:center;gap:8px;background:var(--panel);padding:8px 12px;flex-wrap:wrap;box-shadow:3px 5px 0 #0005;margin-top:10px}
  .controls button{background:#e7d3ae;color:var(--ink);border:0;padding:4px 12px 6px;font:700 20px 'Caveat',cursive;cursor:pointer;box-shadow:2px 2px 0 #0003}
  .controls button:hover{background:#f0dfbe}
  .controls button.rec{background:#c8435e;color:#fff8ee}
  .controls button:disabled{opacity:.5;cursor:default}
  input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
  .time{font:700 20px 'Caveat',cursive;font-variant-numeric:tabular-nums;color:var(--muted);min-width:96px;text-align:center}
  .hint{color:#e8d6b8;font-size:19px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <nav><a href="../">Пиксель-арт</a><a href="./" class="cur">Бумага</a><a href="../shadow/">Театр теней</a></nav>
  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="big-play" id="bigPlay" disabled><span class="btn" id="bigLabel">Загрузка…</span></button>
  </div>
  <div class="controls">
    <button id="btnPlay">▶ Пуск</button>
    <button id="btnRestart" title="С начала">⏮</button>
    <input type="range" id="scrub" min="0" max="135" step="0.01" value="0">
    <span class="time" id="time">0:00 / 2:15</span>
    <button id="btnSound">🔊 Звук</button>
    <button id="btnRec" class="rec">🎬 Скачать видео</button>
  </div>
  <div class="hint">Пробел — пауза · ← → — перемотка · бумажные марионетки на шплинтах, анимация «на двойках» 12 кадров/с — всё вырезано кодом</div>
  <nav><a href="../">Пиксель-арт</a><a href="./" class="cur">Бумага</a><a href="../shadow/">Театр теней</a></nav>
</div>

<script>
'use strict';
// шрифты для canvas грузим заранее, иначе первые кадры рисуются запасным шрифтом
for (const f of ["700 40px 'Amatic SC'", "700 40px 'Caveat'", "500 40px 'Caveat'"]) document.fonts.load(f, 'Принцесса и Дракон Конец').catch(() => {});
// =====================================================================
//  Экран 1280×720, Canvas 2D. Бумажная аппликация / stop-motion cut-out
// =====================================================================
const W = 1280, H = 720, DUR = 135;
const $ = id => document.getElementById(id);
const cv = $('cv'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (a, b, x) => clamp((x - a) / (b - a));
const eio = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const sstep = (a, b, x) => { const k = prog(a, b, x); return k * k * (3 - 2 * k); };
const PI = Math.PI;

function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) {
  let s = 0, a = .5, f = 1, n = 0;
  for (let i = 0; i < o; i++) { s += a * vnoise(x * f + i * 17.3, y * f); n += a; f *= 2; a *= .5; }
  return s / n;
}
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = Math.ceil(w); c.height = Math.ceil(h); return c; };
const rgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function mix(a, b, k) { const A = rgb(a), B = rgb(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * k).toString(16).padStart(2, '0')).join(''); }
function strHash(s) { let h = 7; for (let i = 0; i < s.length; i++) h = Math.imul(h ^ s.charCodeAt(i), 16777619); return (h >>> 0) % 100000; }

// =====================================================================
//  Фактура бумаги: бесшовный тайл зерна + волокна, из него — паттерны цветов
// =====================================================================
const TS = 192;
const GRAIN = (() => {
  const c = mk(TS, TS), g = c.getContext('2d'), im = g.createImageData(TS, TS), d = im.data;
  const pn = (x, y, p) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi, u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const h = (a, b) => hash2(((a % p) + p) % p + 131 * p, ((b % p) + p) % p + 7);
    const A = h(xi, yi), B = h(xi + 1, yi), C = h(xi, yi + 1), D = h(xi + 1, yi + 1);
    return A + (B - A) * u + (C - A) * v + (A - B - C + D) * u * v;
  };
  for (let y = 0; y < TS; y++) for (let x = 0; x < TS; x++) {
    const n = pn(x / TS * 4, y / TS * 4, 4) * .3 + pn(x / TS * 12, y / TS * 12, 12) * .3 + pn(x / TS * 48, y / TS * 48, 48) * .25 + hash2(x * 3 + 1, y * 7 + 2) * .08 - .5 + .035;
    const i = (y * TS + x) * 4;
    if (n > 0) { d[i] = d[i + 1] = d[i + 2] = 255; d[i + 3] = Math.min(255, n * 125); }
    else { d[i] = 60; d[i + 1] = 38; d[i + 2] = 24; d[i + 3] = Math.min(255, -n * 120); }
  }
  g.putImageData(im, 0, 0);
  g.lineCap = 'round';
  for (let i = 0; i < 70; i++) {
    const x = hash2(i, 1) * TS, y = hash2(i, 2) * TS, a = hash2(i, 3) * PI * 2, l = 5 + hash2(i, 4) * 20, b = (hash2(i, 5) - .5) * 8;
    g.strokeStyle = i % 3 ? 'rgba(255,255,255,.13)' : 'rgba(90,60,40,.1)'; g.lineWidth = .5 + hash2(i, 6) * .8;
    for (const ox of [-TS, 0, TS]) for (const oy of [-TS, 0, TS]) {
      g.beginPath(); g.moveTo(x + ox, y + oy);
      g.quadraticCurveTo(x + ox + Math.cos(a) * l / 2 - Math.sin(a) * b, y + oy + Math.sin(a) * l / 2 + Math.cos(a) * b, x + ox + Math.cos(a) * l, y + oy + Math.sin(a) * l); g.stroke();
    }
  }
  return c;
})();
// во время отрисовки кадра (LIVE) куски заливаются плоским цветом, а фактура кладётся
// одним проходом зерна поверх спрайта/области — так кадр дешёвый; статичные слои
// режутся один раз уже из «бумаги» с зерном
let LIVE = false;
const PAT = new Map();
function pf(col, fine) {
  if (LIVE) return col;
  const key = fine ? col + '~' : col; let p = PAT.get(key);
  if (!p) {
    const s = fine ? TS / 2 : TS, c = mk(s, s), g = c.getContext('2d');
    g.fillStyle = col; g.fillRect(0, 0, s, s); g.drawImage(GRAIN, 0, 0, s, s);
    p = ctx.createPattern(c, 'repeat'); PAT.set(key, p);
  }
  return p;
}
const GRAIN2 = mk(TS / 2, TS / 2); GRAIN2.getContext('2d').drawImage(GRAIN, 0, 0, TS / 2, TS / 2);
const GPAT = new Map();
function grainOver(g, x, y, w, h, a = 1, atop = false, fine = false) {
  const k = (g === ctx ? 'm' : 's') + (fine ? 'f' : ''); let p = GPAT.get(k);
  if (!p) { p = g.createPattern(fine ? GRAIN2 : GRAIN, 'repeat'); GPAT.set(k, p); }
  g.save(); if (atop) g.globalCompositeOperation = 'source-atop'; g.globalAlpha = a;
  g.translate(Math.round(x), Math.round(y)); g.fillStyle = p; g.fillRect(0, 0, w, h); g.restore();
}

// =====================================================================
//  Геометрия: рваный/резаный контур, сплайны, эллипсы
// =====================================================================
function roughPts(pts, seed, amp, step, grow = 0) {
  let A = 0;
  for (let i = 0, n = pts.length; i < n; i++) { const a = pts[i], b = pts[(i + 1) % n]; A += a[0] * b[1] - b[0] * a[1]; }
  const sg = A > 0 ? 1 : -1, out = []; let acc = 0;
  for (let i = 0, n = pts.length; i < n; i++) {
    const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % n], len = Math.hypot(bx - ax, by - ay) || 1e-6;
    const nx = sg * (by - ay) / len, ny = -sg * (bx - ax) / len, segs = Math.max(1, Math.ceil(len / step));
    for (let k = 0; k < segs; k++) {
      const f = k / segs, d = (vnoise(acc / step * .45, seed) - .5) * 2 * amp + (hash2(Math.floor(acc * 7), seed) - .5) * amp * .5 + grow;
      out.push([ax + (bx - ax) * f + nx * d, ay + (by - ay) * f + ny * d]); acc += len / segs;
    }
  }
  return out;
}
function toPath(pts) { const p = new Path2D(); p.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) p.lineTo(pts[i][0], pts[i][1]); p.closePath(); return p; }
function spl(c, per = 5) {
  const out = [], n = c.length;
  for (let i = 0; i < n; i++) {
    const p0 = c[(i - 1 + n) % n], p1 = c[i], p2 = c[(i + 1) % n], p3 = c[(i + 2) % n];
    for (let k = 0; k < per; k++) {
      const t = k / per, t2 = t * t, t3 = t2 * t, q = [0, 0];
      for (let j = 0; j < 2; j++) q[j] = .5 * (2 * p1[j] + (-p0[j] + p2[j]) * t + (2 * p0[j] - 5 * p1[j] + 4 * p2[j] - p3[j]) * t2 + (-p0[j] + 3 * p1[j] - 3 * p2[j] + p3[j]) * t3);
      out.push(q);
    }
  }
  return out;
}
function ell(cx, cy, rx, ry, n = 28, a0 = 0) { const r = []; for (let i = 0; i < n; i++) { const a = a0 + i / n * PI * 2; r.push([cx + Math.cos(a) * rx, cy + Math.sin(a) * ry]); } return r; }
function ridgePts(f, x0, x1, step, yb) { const r = [[x0, yb]]; for (let x = x0; x <= x1 + step - 1; x += step) r.push([Math.min(x, x1), f(Math.min(x, x1))]); r.push([x1, yb]); return r; }
const lp = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];

// ----- статичные бумажные куски (для слоёв-диорамы, рисуются один раз) -----
function tp(g, pts, col, seed, o = {}) {
  const amp = o.amp ?? 3, step = o.step ?? 7, sh = o.sh === undefined ? [10, 2, 4, .3] : o.sh;
  g.save();
  if (sh) { g.shadowColor = `rgba(${o.shc || '28,12,18'},${sh[3]})`; g.shadowBlur = sh[0]; g.shadowOffsetX = sh[1]; g.shadowOffsetY = sh[2]; }
  if (o.edge !== false) {
    g.fillStyle = pf(o.ec || mix(col, '#fff6e4', o.ek ?? .42)); g.fill(toPath(roughPts(pts, seed + 71, amp * .55, step, 1.6)));
    g.shadowColor = 'transparent';
  }
  g.fillStyle = pf(col); g.fill(toPath(roughPts(pts, seed, amp, step)));
  g.restore();
}
function hangSky(g, w, cols, bottoms, seed) {
  g.fillStyle = pf(cols[0]); g.fillRect(0, 0, w, H);
  bottoms.forEach((b, i) => {
    const pts = [[-30, -30], [w + 30, -30]];
    for (let x = w + 30; x >= -30; x -= 30) pts.push([x, b + Math.sin(x * .0055 + i * 1.9 + seed) * 12 + Math.sin(x * .019 + i) * 4]);
    tp(g, pts, cols[i + 1], seed * 10 + i, { amp: 3, sh: [18, 0, 6, .3], ek: .3 });
  });
}
function cloudPts(cx, cy, w, h, seed) {
  const nb = Math.max(3, Math.round(w / 46)), cs = [];
  for (let i = 0; i < nb; i++) {
    const x = cx - w / 2 + (i + .5) * w / nb + (hash2(i, seed) - .5) * w / nb * .5, e = Math.abs(x - cx) / (w / 2);
    cs.push([x, h * (.5 + hash2(i, seed + 1) * .55) * (1 - e * .5)]);
  }
  const x0 = Math.min(...cs.map(c => c[0] - c[1])), x1 = Math.max(...cs.map(c => c[0] + c[1])), pts = [];
  for (let x = x0; x <= x1; x += 5) {
    let y = cy;
    for (const [xc, r] of cs) if (Math.abs(x - xc) < r) y = Math.min(y, cy - Math.sqrt(r * r - (x - xc) * (x - xc)));
    pts.push([x, y]);
  }
  pts.push([x1, cy + h * .1], [x0, cy + h * .1]);
  return pts;
}
function cloud(g, cx, cy, w, h, col, seed, o = {}) {
  tp(g, cloudPts(cx, cy, w, h, seed), col, seed, { amp: 2.5, sh: o.sh ?? [14, 2, 5, .25], ek: .5 });
  if (o.under) tp(g, cloudPts(cx + w * .06, cy + h * .08, w * .8, h * .5, seed + 9), o.under, seed + 5, { amp: 2, sh: [6, 1, 2, .15], ek: .5 });
}
function pine(g, cx, by, h, w, col, seed, tiers = 3, o = {}) {
  if (o.trunk) tp(g, [[cx - w * .08, by], [cx + w * .08, by], [cx + w * .06, by - h * .3], [cx - w * .06, by - h * .3]], o.trunk, seed + 3, { amp: 1, sh: o.sh ?? [6, 1, 2, .25], edge: false });
  for (let i = 0; i < tiers; i++) {
    const k = i / Math.max(1, tiers - 1), top = by - h + k * h * .5, bot = top + h * .42 + (i === tiers - 1 ? h * .06 : 0), hw = w * (.38 + k * .62);
    const pts = [[cx, top]];
    const n = 5; for (let j = 0; j <= n; j++) pts.push([cx + hw - j * 2 * hw / n, bot + (j % 2 ? -h * .03 : 0)]);
    tp(g, pts, i % 2 ? (o.col2 || col) : col, seed * 7 + i, { amp: 1.5, step: 6, sh: o.sh ?? [6, 1, 3, .28], ek: o.ek ?? .3 });
  }
}
function crown(cx, cy, r, seed) { const p = []; for (let i = 0; i < 30; i++) { const a = i / 30 * PI * 2; p.push([cx + Math.cos(a) * r * (1 + .1 * Math.sin(a * 5 + seed) + .06 * Math.sin(a * 9 + seed * 2)), cy + Math.sin(a) * r * .86 * (1 + .1 * Math.sin(a * 5 + seed))]); } return p; }
function starPath(n = 5, inner = .45) { const p = []; for (let i = 0; i < n * 2; i++) { const a = -PI / 2 + i * PI / n, r = i % 2 ? inner : 1; p.push([Math.cos(a) * r, Math.sin(a) * r]); } return toPath(p); }
const STAR5 = starPath(5, .45), STAR4 = starPath(4, .36);
function blocks(g, x0, y0, x1, y1, bw, bh, cols, seed, gap = 4) {
  for (let r = 0, y = y0; y < y1; r++, y += bh) for (let x = x0 - (r % 2) * bw / 2, c = 0; x < x1; x += bw, c++) {
    const a = Math.max(x0, x + gap / 2), b = Math.min(x1, x + bw - gap / 2), yy = Math.min(y1, y + bh - gap);
    if (b - a < 6 || yy - y < 4) continue;
    tp(g, [[a, y], [b, y], [b, yy], [a, yy]], cols[Math.floor(hash2(r * 31 + c, seed) * cols.length)], seed + r * 17 + c, { amp: 1.4, step: 6, sh: [4, 1, 2, .3], ek: .18 });
  }
}
function moonCanvas(r, col, bite) {
  const c = mk(r * 2 + 4, r * 2 + 4), g = c.getContext('2d');
  g.fillStyle = pf(col); g.fill(toPath(roughPts(ell(r + 2, r + 2, r, r, 40), 5, 1.2, 5)));
  if (bite) { g.globalCompositeOperation = 'destination-out'; g.beginPath(); g.arc(r + 2 + r * bite[0], r + 2 + r * bite[1], r * bite[2], 0, PI * 2); g.fill(); }
  return c;
}

// ----- кадр: слои, дрожь, свечения -----
let JF = 0, JI = 0, G = ctx;
const jx = k => (hash2(JF, k * 7 + 1) - .5) * .8, jy = k => (hash2(JF, k * 7 + 2) - .5) * .8;
function img(c, x, y, k) { ctx.drawImage(c, x + jx(k), y + jy(k)); }
function imgWrap(c, off, k) { const w = c.width; let x = -(((off % w) + w) % w); ctx.drawImage(c, x + jx(k), jy(k)); if (x + w < W) ctx.drawImage(c, x + w + jx(k), jy(k)); }
function glow(x, y, r, col, a) {
  const gr = ctx.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, `rgba(${col},${a})`); gr.addColorStop(.45, `rgba(${col},${a * .4})`); gr.addColorStop(1, `rgba(${col},0)`);
  ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.restore();
}
function vellum(pts, col) { ctx.save(); ctx.fillStyle = col; ctx.fill(toPath(pts)); ctx.restore(); }

// ----- бумажное пламя, вода, водопад, конфетти -----
function flamePts(x, y, h, w, F, seed) {
  const j = k => (hash2(F * 13 + k, seed) - .5);
  return spl([
    [x - w * .9, y - h * .12], [x - w * .78 + j(1) * w * .4, y - h * (.56 + j(2) * .22)], [x - w * .3, y - h * .42],
    [x + j(3) * w * .5, y - h * (1 + j(4) * .2)], [x + w * .32, y - h * .5],
    [x + w * .72 + j(5) * w * .4, y - h * (.64 + j(6) * .22)], [x + w * .9, y - h * .12],
    [x + w * .5, y + h * .05], [x - w * .5, y + h * .05]], 4);
}
function paperFlame(g, x, y, h, w, F, seed) {
  g.save(); g.shadowColor = 'rgba(110,30,0,.35)'; g.shadowBlur = 0; g.shadowOffsetX = 1.5; g.shadowOffsetY = 2;
  [['#d23c1c', 1, 0], ['#ff8226', .74, .02], ['#ffcc4e', .5, .04], ['#fff3c0', .24, .05]].forEach(([c, k, dy], i) => {
    g.fillStyle = pf(c, true); g.fill(toPath(flamePts(x, y - h * dy, h * k, w * (k * .75 + .25), F, seed + i * 11)));
  });
  g.restore();
}
function confetti(g, x, y, s, a, col) { g.save(); g.translate(x, y); g.rotate(a); g.fillStyle = col; g.fillRect(-s / 2, -s * .35, s, s * .7); g.restore(); }

  if (k === 'bird') { const o = osc('sine', ev.f, when, .25, g); o.frequency.setValueAtTime(ev.f, when); o.frequency.exponentialRampToValueAtTime(ev.f * 1.4, when + .06); o.frequency.exponentialRampToValueAtTime(ev.f * .9, when + .14); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(.025, when + .02); g.gain.exponentialRampToValueAtTime(.001, when + .2); g.connect(verbIn); return; }
  if (k === 'roar') {
    const ws = AC.createWaveShaper(), curve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 4); } ws.curve = curve;
    const f = filt('lowpass', 900, g); ws.connect(f);
    for (const [fr, det] of [[95, 0], [97, 30], [48, 0]]) { const o = osc('sawtooth', fr, when, 1.8, ws); o.detune.value = det; o.frequency.linearRampToValueAtTime(fr * .62, when + 1.7); }
    noise(when, 1.8, filt('bandpass', 500, ws, .6));
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(.32, when + .12); g.gain.linearRampToValueAtTime(.25, when + 1); g.gain.exponentialRampToValueAtTime(.001, when + 1.8);
    g.connect(verbIn); return;
  }
  if (k === 'whoosh') { const f = filt('bandpass', 400, g, .7); f.frequency.setValueAtTime(300, when); f.frequency.exponentialRampToValueAtTime(1600, when + .5); f.frequency.exponentialRampToValueAtTime(200, when + 1.2); noise(when, 1.3, f); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(ev.v, when + .4); g.gain.exponentialRampToValueAtTime(.001, when + 1.25); return; }
  if (k === 'flap') { noise(when, .35, filt('lowpass', 380, g)); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(.4, when + .06); g.gain.exponentialRampToValueAtTime(.001, when + .32); return; }
  if (k === 'crackle') { noise(when, .03, filt('highpass', 2500, g)); g.gain.setValueAtTime(.08, when); g.gain.exponentialRampToValueAtTime(.001, when + .03); return; }
}
function startAudio(from) {
  ensureAC(); AC.resume();
  buildGraph();
  tStart = from; acStart = AC.currentTime + .06;
  evIdx = 0; while (evIdx < EVENTS.length && EVENTS[evIdx].t < from) evIdx++;
  // уже звучащие длинные события: реплики и эмбиент
  for (const ev of EVENTS) {
    if (ev.t >= from) break;
    if (ev.k === 'voice') { const v = VMAP[ev.id]; if (from < ev.t + v.dur - .1) play(ev, acStart, from - ev.t); }
    if ((ev.k === 'amb' || ev.k === 'wind') && from < ev.t + ev.d - .5) play(ev, acStart, from - ev.t);
  }
  schedule(); clearInterval(schedTimer); schedTimer = setInterval(schedule, 40);
}
function schedule() {
  if (!playing) return;
  const horizon = curTime() + .6;
  while (evIdx < EVENTS.length && EVENTS[evIdx].t < horizon) { const ev = EVENTS[evIdx++]; play(ev, Math.max(AC.currentTime, at(ev.t))); }
}
function stopAudio() {
  clearInterval(schedTimer);
  if (!master) return;
  const m = master; master = null;
  m.gain.setTargetAtTime(0, AC.currentTime, .03);
  for (const s of live) try { s.stop(AC.currentTime + .15); } catch (e) { }
  live = [];
  setTimeout(() => m.disconnect(), 300);
}

// =====================================================================
//  Загрузка озвучки (+ огибающая для синхронизации губ)
// =====================================================================
async function loadVoices() {
  ensureAC();
  await Promise.all(VOICE.map(async v => {
    const res = await fetch(`../voice/${v.id}.mp3`); const ab = await res.arrayBuffer();
    v.buf = await new Promise((ok, err) => AC.decodeAudioData(ab, ok, err));
    v.dur = v.buf.duration;
    const d = v.buf.getChannelData(0), win = Math.floor(v.buf.sampleRate / ENV_RATE), n = Math.ceil(d.length / win), e = new Float32Array(n);
    let mx = 0;
    for (let i = 0; i < n; i++) { let s = 0; for (let j = i * win; j < Math.min(d.length, (i + 1) * win); j++) s += d[j] * d[j]; e[i] = Math.sqrt(s / win); mx = Math.max(mx, e[i]); }
    for (let i = 0; i < n; i++) e[i] = clamp((e[i] / mx - .08) * 1.6);
    v.env = e;
  }));
}

// =====================================================================
//  Плеер
// =====================================================================
let t = 0, recorder = null, seekTimer = 0, ready = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function curTime() { return playing ? tStart + (AC.currentTime - acStart) : t; }
function ui() {
  $('btnPlay').textContent = playing ? '⏸ Пауза' : '▶ Пуск';
  $('btnSound').textContent = soundOn ? '🔊 Звук' : '🔇 Без звука';
  $('btnRec').textContent = recorder ? '⏺ Запись…' : '🎬 Скачать видео';
  $('btnRec').disabled = !!recorder || !ready;
  $('bigPlay').hidden = playing || t > .05;
}
function playIt() { if (!ready) return; if (t >= DUR - .05) t = 0; playing = true; startAudio(t); ui(); }
function pause() { if (playing) t = clamp(curTime(), 0, DUR); playing = false; stopAudio(); if (recorder && recorder.state === 'recording') recorder.stop(); ui(); }
function toggle() { playing ? pause() : playIt(); }
function seek(x) {
  const was = playing; if (playing) { playing = false; stopAudio(); }
  t = clamp(x, 0, DUR);
  if (was) { clearTimeout(seekTimer); seekTimer = setTimeout(playIt, 120); }
  ui();
}
async function record() {
  if (recorder || !ready) return;
  if (!window.MediaRecorder || !cv.captureStream) { alert('Этот браузер не умеет записывать видео с canvas. Попробуй Chrome.'); return; }
  const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
  ensureAC(); await AC.resume();
  pause();
  recDest = AC.createMediaStreamDestination();
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 10e6 } : {});
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const type = recorder.mimeType || 'video/webm', a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = 'princessa-i-drakon.' + (type.includes('mp4') ? 'mp4' : 'webm'); a.click();
    recorder = null; recDest = null; ui();
  };
  t = 0; render(0); recorder.start(); playIt();
}
function loop() {
  if (playing) { t = curTime(); if (t >= DUR) { t = DUR; pause(); } }
  render(Math.min(Math.max(t, 0), DUR - .001));
  const sc = $('scrub'); if (document.activeElement !== sc || playing) sc.value = t;
  $('time').textContent = `${fmt(t)} / ${fmt(DUR)}`;
  requestAnimationFrame(loop);
}
$('bigPlay').onclick = playIt; cv.onclick = toggle; $('btnPlay').onclick = toggle;
$('btnRestart').onclick = () => { seek(0); if (!playing) setTimeout(playIt, 130); };
$('scrub').oninput = e => seek(+e.target.value);
$('btnSound').onclick = () => { soundOn = !soundOn; if (mon) mon.gain.value = soundOn ? 1 : 0; ui(); };
$('btnRec').onclick = record;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight') seek(curTime() + 5);
  if (e.code === 'ArrowLeft') seek(curTime() - 5);
});
const hm = location.hash.match(/t=([\d.]+)/); if (hm) t = +hm[1];
ui(); requestAnimationFrame(loop);
loadVoices().then(() => { ready = true; $('bigPlay').disabled = false; $('bigLabel').textContent = '▶ Смотреть сказку'; ui(); })
  .catch(err => { console.error(err); ready = true; $('bigPlay').disabled = false; $('bigLabel').textContent = '▶ Смотреть (без озвучки)'; ui(); });

// заранее режем все слои-диорамы, чтобы смена сцен не подтормаживала
for (const s of SCENES) if (!s.built) { s.build(); s.built = true; }
</script>
</body>
