<style>

  nav.styles span{color:var(--muted);font-style:italic;margin-right:6px}
  nav.styles a{color:var(--muted);text-decoration:none;padding:3px 14px;border:1px solid var(--line);border-radius:999px}

  nav.styles a[aria-current]{color:#1a0f10;background:var(--accent);border-color:var(--accent)}
  .stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px #4a2e22,0 0 0 7px #120a0a,0 0 0 8px #5a3a28,0 30px 80px #000c}

  .big-play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9%;gap:12px;background:linear-gradient(transparent 45%,#000a);border:0;color:#fff;cursor:pointer}
  .big-play .btn{background:#0a0608e6;color:var(--accent);padding:12px 34px;border:1px solid var(--accent);border-radius:999px;font:italic 700 clamp(20px,3vw,34px) 'Cormorant Garamond',Georgia,serif;box-shadow:0 0 30px #ffb05a55}
  .big-play:hover .btn{background:var(--accent);color:#1a0f10}
  .big-play[hidden]{display:none}
  .big-play:disabled{cursor:wait}
  .controls{display:flex;align-items:center;gap:8px;background:var(--panel);padding:10px 12px;border:1px solid var(--line);border-radius:6px;flex-wrap:wrap}
  .controls button{background:#2a1a18;color:var(--fg);border:1px solid #4a2e26;border-radius:4px;padding:7px 12px;font:500 15px 'Lora',Georgia,serif;cursor:pointer}

  .controls button.rec{background:#5a1a22}
  .controls button:disabled{opacity:.5;cursor:default}

  .time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:96px;text-align:center}
  .hint{color:var(--muted);font-size:14px;text-align:center;font-style:italic}

<script>
'use strict';
// =====================================================================
//  Экран 1280×720, Canvas 2D: чёрные силуэты на светящемся фоне
// =====================================================================
const W = 1280, H = 720, DUR = 135;
const $ = id => document.getElementById(id);
const cv = $('cv'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d');
const INK = '#0a0608';
const FONT_T = `'Cormorant Garamond', Georgia, serif`, FONT_S = `'Lora', Georgia, serif`;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (a, b, x) => clamp((x - a) / (b - a));
const eio = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const sstep = (a, b, x) => { const k = prog(a, b, x); return k * k * (3 - 2 * k); };
const PI = Math.PI;

function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) {
  let s = 0, a = .5, f = 1, n = 0;
  for (let i = 0; i < o; i++) { s += a * vnoise(x * f + i * 17.3, y * f); n += a; f *= 2; a *= .5; }
  return s / n;
}

// =====================================================================
//  Холсты, слои и вырезание кружева
// =====================================================================
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
let G = ctx; // текущая цель рисования
function paint(c, fn) { const prev = G; G = c.getContext('2d'); G.fillStyle = G.strokeStyle = INK; G.lineCap = G.lineJoin = 'round'; fn(G); G = prev; return c; }
const POOL = []; let depth = 0;
// слой-кукла: рисуем силуэт в отдельный холст, прорезаем ажур, переносим на сцену
// box = [x0, y0, x1, y1] — область куклы на экране: чистим и переносим только её
function layer(fn, box) {
  const dst = G;
  if (!POOL[depth]) { const c = mk(W, H); POOL[depth] = { c, g: c.getContext('2d'), dirty: [0, 0, W, H] }; }
  const L = POOL[depth++], g = L.g;
  const b = box ? [Math.max(0, Math.floor(box[0])), Math.max(0, Math.floor(box[1])), Math.min(W, Math.ceil(box[2])), Math.min(H, Math.ceil(box[3]))] : [0, 0, W, H];
  const dd = L.dirty;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = 'source-over'; g.globalAlpha = 1; g.clearRect(dd[0], dd[1], dd[2] - dd[0], dd[3] - dd[1]); g.clearRect(b[0], b[1], b[2] - b[0], b[3] - b[1]);
  L.dirty = b;
  g.fillStyle = g.strokeStyle = INK; g.lineCap = g.lineJoin = 'round';
  G = g; let r; try { r = fn(g); } finally { G = dst; depth--; }
  g.setTransform(1, 0, 0, 1, 0, 0);
  if (b[2] > b[0] && b[3] > b[1]) dst.drawImage(L.c, b[0], b[1], b[2] - b[0], b[3] - b[1], b[0], b[1], b[2] - b[0], b[3] - b[1]);
  return r;
}
function cut(fn) {
  const g = G, op = g.globalCompositeOperation, fs = g.fillStyle, ss = g.strokeStyle;
  g.globalCompositeOperation = 'destination-out'; g.fillStyle = g.strokeStyle = '#000';
  fn(g); g.globalCompositeOperation = op; g.fillStyle = fs; g.strokeStyle = ss;
}

// ----- примитивы (рисуют в G с текущей матрицей) -----
function poly(pts, close = true) { G.beginPath(); G.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) G.lineTo(pts[i][0], pts[i][1]); if (close) G.closePath(); }
function spline(pts, close = true) {
  const n = pts.length, P = i => close ? pts[(i + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  G.beginPath(); G.moveTo(pts[0][0], pts[0][1]);
  for (let i = 0; i < (close ? n : n - 1); i++) {
    const p0 = P(i - 1), p1 = P(i), p2 = P(i + 1), p3 = P(i + 2);
    G.bezierCurveTo(p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6, p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6, p2[0], p2[1]);
  }
  if (close) G.closePath();
}
const fillPoly = pts => { poly(pts); G.fill(); };
const fillSpline = pts => { spline(pts); G.fill(); };
function ell(x, y, rx, ry, rot = 0) { G.beginPath(); G.ellipse(x, y, Math.max(.01, rx), Math.max(.01, ry), rot, 0, PI * 2); G.fill(); }
const dot = (x, y, r) => ell(x, y, r, r);
function seg(x0, y0, x1, y1) { G.beginPath(); G.moveTo(x0, y0); G.lineTo(x1, y1); G.stroke(); }
function ribbon(pts, r0, r1 = r0) {
  const g = G, n = pts.length; if (n < 2) return;
  const rf = typeof r0 === 'function' ? r0 : k => r0 + (r1 - r0) * k;
  const A = [], B = [];
  for (let i = 0; i < n; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)];
    let dx = b[0] - a[0], dy = b[1] - a[1]; const l = Math.hypot(dx, dy) || 1; dx /= l; dy /= l;
    const r = rf(i / (n - 1));
    A.push([pts[i][0] - dy * r, pts[i][1] + dx * r]); B.push([pts[i][0] + dy * r, pts[i][1] - dx * r]);
  }
  g.beginPath(); g.moveTo(A[0][0], A[0][1]);
  for (let i = 1; i < n; i++) g.lineTo(A[i][0], A[i][1]);
  for (let i = n - 1; i >= 0; i--) g.lineTo(B[i][0], B[i][1]);
  g.closePath(); g.fill();
  const rs = rf(0), re = rf(1);
  if (rs > .3) { g.beginPath(); g.arc(pts[0][0], pts[0][1], rs, 0, PI * 2); g.fill(); }
  if (re > .3) { g.beginPath(); g.arc(pts[n - 1][0], pts[n - 1][1], re, 0, PI * 2); g.fill(); }
}
// миндалина (лист, глаз): длинная ось под углом ang
function almond(x, y, len, w, ang) {
  const c = Math.cos(ang), s = Math.sin(ang), hx = c * len / 2, hy = s * len / 2, nx = -s * w, ny = c * w;
  G.beginPath(); G.moveTo(x - hx, y - hy); G.quadraticCurveTo(x + nx, y + ny, x + hx, y + hy); G.quadraticCurveTo(x - nx, y - ny, x - hx, y - hy); G.fill();
}
// капля: круглая часть в (x,y), острие в направлении ang
function tear(x, y, len, w, ang) {
  const c = Math.cos(ang), s = Math.sin(ang), tx = x + c * len, ty = y + s * len;
  G.beginPath(); G.moveTo(tx, ty);
  G.bezierCurveTo(x + c * len * .35 - s * w, y + s * len * .35 + c * w, x - c * w * 1.3 - s * w, y - s * w * 1.3 + c * w, x - c * w, y - s * w);
  G.bezierCurveTo(x - c * w * 1.3 + s * w, y - s * w * 1.3 - c * w, x + c * len * .35 + s * w, y + s * len * .35 - c * w, tx, ty);
  G.fill();
}
// завиток-спираль: старт в (x,y) с курсом h, закручивается всё туже
function curlPts(x, y, h, len, dir = 1, turns = 1.3, n = 28) {
  const pts = [[x, y]];
  for (let i = 1; i <= n; i++) {
    const k = i / n, ds = len / n * (1.6 - k * 1.2);
    h += dir * (turns * 2 * PI / n) * (.3 + k * 1.4);
    x += Math.cos(h) * ds; y += Math.sin(h) * ds; pts.push([x, y]);
  }
  return pts;
}
function curl(x, y, h, len, w, dir = 1, turns = 1.3) { ribbon(curlPts(x, y, h, len, dir, turns), w, w * .25); }
// изогнутый шип/коготь: основание в (x,y), остриё в направлении ang, загиб hook
function spike(x, y, ang, h, w, hook = .35) {
  const c = Math.cos(ang), s = Math.sin(ang), nx = -s, ny = c;
  const tx = x + c * h + nx * h * hook, ty = y + s * h + ny * h * hook;
  G.beginPath(); G.moveTo(x - nx * w, y - ny * w);
  G.quadraticCurveTo(x + c * h * .6 - nx * w * .2, y + s * h * .6 - ny * w * .2, tx, ty);
  G.quadraticCurveTo(x + c * h * .3 + nx * w * .8, y + s * h * .3 + ny * w * .8, x + nx * w, y + ny * w);
  G.closePath(); G.fill();
}
function bez(p0, p1, p2, n = 16) {
  const r = [];
  for (let i = 0; i <= n; i++) { const k = i / n, a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k; r.push([a * p0[0] + b * p1[0] + c * p2[0], a * p0[1] + b * p1[1] + c * p2[1]]); }
  return r;
}
function linGrad(g, y0, y1, stops, x0 = 0, x1 = 0) { const gr = g.createLinearGradient(x0, y0, x1, y1); for (const [o, c] of stops) gr.addColorStop(o, c); return gr; }
function radGrad(g, x, y, r0, r1, stops) { const gr = g.createRadialGradient(x, y, r0, x, y, r1); for (const [o, c] of stops) gr.addColorStop(o, c); return gr; }
// мягкое свечение (аддитивно)
function glow(g, x, y, r, col, a = 1) {
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = a;
  g.fillStyle = radGrad(g, x, y, 0, r, [[0, col], [1, 'rgba(0,0,0,0)']]); g.fillRect(x - r, y - r, r * 2, r * 2); g.restore();
}
function ridge(x0, x1, fn, yb, step = 4) {
  const g = G; g.beginPath(); g.moveTo(x0, yb);
  for (let x = x0; x <= x1; x += step) g.lineTo(x, fn(x));
  g.lineTo(x1, fn(x1)); g.lineTo(x1, yb); g.closePath(); g.fill();
}

// =====================================================================
//  Флора и декор: филигранные деревья, ели, травы, цветы, облака
// =====================================================================
function branch(x, y, ang, len, w, d, seed, o) {
  const n = 8, bend = (hash2(seed, d * 3 + 1) - .5) * .9; let a = ang, px = x, py = y; const pts = [[x, y]];
  for (let i = 1; i <= n; i++) { a += bend / n; px += Math.cos(a) * len / n; py += Math.sin(a) * len / n; pts.push([px, py]); }
  ribbon(pts, w, w * .66);
  const lv = o.leaves !== false;
  if (d <= 1 && lv) for (let i = 2; i <= n; i += 2) {
    const [lx, ly] = pts[i], sd = (i / 2) % 2 ? 1 : -1, la = a + sd * 1.0;
    almond(lx + Math.cos(la) * len * .09, ly + Math.sin(la) * len * .09, len * .2 * (o.leaf || 1), len * .085 * (o.leaf || 1), la);
  }
  if (d === 0) {
    const dir = hash2(seed, 9) > .5 ? 1 : -1;
    ribbon(curlPts(px, py, a, len * .55, dir, 1.15, 18), w * .66, w * .18);
    if (lv) for (let j = 0; j < 3; j++) { const la = a + (j - 1) * .9; almond(px + Math.cos(la) * len * .12, py + Math.sin(la) * len * .12, len * .24 * (o.leaf || 1), len * .1 * (o.leaf || 1), la); }
    return;
  }
  const kids = 2 + (hash2(seed, d * 7) > .55 ? 1 : 0);
  for (let j = 0; j < kids; j++) {
    let na = a + (j - (kids - 1) / 2) * (.72 + hash2(seed, j + 11) * .35) + (hash2(seed, j + 21) - .5) * .3;
    if (o.up !== false) na = lerp(na, -PI / 2, .12);
    branch(px, py, na, len * (.6 + hash2(seed, j + 31) * .18), w * .64, d - 1, seed * 7 + j * 13 + 3, o);

function tree(x, y, h, seed, o = {}) { branch(x, y, -PI / 2 + (o.lean || 0) + (hash2(seed, 1) - .5) * .2, h * .42, o.w || h * .045, o.depth ?? 4, seed, o); }
function pine(x, by, h, w, seed = 0) {
  const g = G, tiers = 6;
  g.fillRect(x - w * .06, by - h * .2, w * .12, h * .2);
  for (let i = 0; i < tiers; i++) {
    const k = i / (tiers - 1), top = by - h + k * h * .62, bot = top + h * .3, hw = w * (.22 + k * .78) * (.85 + hash2(seed, i) * .3) / 2;
    g.beginPath(); g.moveTo(x, top);
    g.quadraticCurveTo(x + hw * .35, bot - h * .1, x + hw, bot);
    g.quadraticCurveTo(x + hw * .5, bot - h * .045, x, bot - h * .02);
    g.quadraticCurveTo(x - hw * .5, bot - h * .045, x - hw, bot);
    g.quadraticCurveTo(x - hw * .35, bot - h * .1, x, top);
    g.fill();

}
function blade(x, y, h, lean, w = 1.6) {
  const g = G, tx = x + lean, ty = y - h;
  g.beginPath(); g.moveTo(x - w, y); g.quadraticCurveTo(x + lean * .15, y - h * .6, tx, ty); g.quadraticCurveTo(x + lean * .3 + w * .5, y - h * .5, x + w, y); g.closePath(); g.fill();

function tuft(x, y, h, n, seed, spread = 1) {
  for (let i = 0; i < n; i++) blade(x + (hash2(seed, i) - .5) * n * 2.6, y + 2, h * (.45 + hash2(seed, i + 20) * .7), (hash2(seed, i + 40) - .5) * h * .9 * spread, 1.1 + hash2(seed, i + 60) * .9);

function flower(x, y, h, kind, seed) {
  const g = G, lean = (hash2(seed, 1) - .5) * h * .4, tx = x + lean, ty = y - h;
  g.lineWidth = 1.6; g.beginPath(); g.moveTo(x, y); g.quadraticCurveTo(x, y - h * .5, tx, ty); g.stroke();

    g.save(); g.translate(tx, ty); g.rotate(.5);
    g.beginPath(); g.moveTo(0, 0); g.quadraticCurveTo(6, 1, 7, 9); g.lineTo(5, 8); g.lineTo(3.5, 10); g.lineTo(1.5, 8.5); g.lineTo(-1, 10); g.lineTo(-2, 8); g.quadraticCurveTo(-3, 2, 0, 0); g.fill(); g.restore();

    for (let i = 0; i < 9; i++) { const a = i / 9 * PI * 2; almond(tx + Math.cos(a) * 5, ty + Math.sin(a) * 5, 8, 3.2, a); }
    dot(tx, ty, 3);
    cut(() => dot(tx, ty, 1.2));

    g.lineWidth = .8;
    for (let i = 0; i < 16; i++) { const a = i / 16 * PI * 2; seg(tx, ty, tx + Math.cos(a) * 9, ty + Math.sin(a) * 9); dot(tx + Math.cos(a) * 9.5, ty + Math.sin(a) * 9.5, 1.3); }
    dot(tx, ty, 2.2);
  }
}
function fern(x, y, len, ang, seed, w = 2) {
  const pts = []; let a = ang, px = x, py = y; const n = 14;
  for (let i = 0; i <= n; i++) { pts.push([px, py]); a += .07; px += Math.cos(a) * len / n; py += Math.sin(a) * len / n; }

  for (let i = 2; i < n; i++) { const [lx, ly] = pts[i], k = 1 - i / n; for (const sd of [-1, 1]) { const la = a - .07 * (n - i) + sd * 1.1; almond(lx + Math.cos(la) * len * .06 * k, ly + Math.sin(la) * len * .06 * k, len * .16 * k + 2, len * .045 * k + .8, la); } }

// бумажная лента-облако с гребешками
function cloudBand(cx, cy, w, h, seed) {
  const g = G, n = Math.max(4, Math.round(w / (h * 2.4)));
  g.beginPath(); g.moveTo(cx - w / 2, cy);

    s.start(when, offset); live.push(s);
    const end = when + v.dur - offset;
    musicBus.gain.setTargetAtTime(.32, Math.max(AC.currentTime, when - .15), .12);
    musicBus.gain.setTargetAtTime(.85, end + .05, .35);
    return;
  }
  if (k === 'pad') {
    g.connect(musicBus); const f = filt('lowpass', 1100, g);
    for (const det of [-7, 7]) { const o = osc('sawtooth', mtof(ev.m), when, ev.d, f); o.detune.value = det; }
    env(g, when, ev.v || .02, .7, ev.d, .6); return;
  }
  if (k === 'harp' || k === 'lute') {
    g.connect(musicBus); const f = filt('lowpass', k === 'lute' ? 2200 : 3200, g);
    osc('triangle', mtof(ev.m), when, ev.d, f); const o2 = osc('sine', mtof(ev.m) * 2, when, ev.d, f);
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(k === 'lute' ? .05 : .07, when + .005); g.gain.exponentialRampToValueAtTime(.0001, when + ev.d);
    return;
  }
  if (k === 'cel') {
    g.connect(musicBus); osc('sine', mtof(ev.m), when, ev.d, g); const h = AC.createGain(); h.gain.value = .25; h.connect(g); osc('sine', mtof(ev.m) * 4, when, ev.d, h);
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(ev.v || .06, when + .004); g.gain.exponentialRampToValueAtTime(.0001, when + ev.d); return;
  }
  if (k === 'flute') {
    g.connect(musicBus); const f = filt('lowpass', 2600, g);
    const o = osc('sine', mtof(ev.m), when, ev.d, f); const o2 = osc('triangle', mtof(ev.m), when, ev.d, f);
    const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 5.2; lg.gain.value = mtof(ev.m) * .006; lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency); lfo.start(when); lfo.stop(when + ev.d + .05);
    env(g, when, .075, .07, ev.d + .08, .14); return;
  }
  if (k === 'brass') {
    g.connect(musicBus); const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.Q.value = 2; f.connect(g);
    f.frequency.setValueAtTime(500, when); f.frequency.linearRampToValueAtTime(2400, when + .08); f.frequency.linearRampToValueAtTime(1300, when + .3);
    for (const det of [-6, 6]) { const o = osc('sawtooth', mtof(ev.m), when, ev.d, f); o.detune.value = det; }
    env(g, when, .06, .04, ev.d + .05, .12); return;
  }
  if (k === 'bass') { g.connect(musicBus); osc('triangle', mtof(ev.m), when, ev.d, g); env(g, when, .13, .01, ev.d, .15); return; }
  if (k === 'drone') { g.connect(musicBus); const f = filt('lowpass', 320, g); osc('sawtooth', mtof(ev.m), when, ev.d, f); env(g, when, .045, .5, ev.d, .4); return; }
  if (k === 'arp') { g.connect(musicBus); const f = filt('lowpass', 1800, g); osc('square', mtof(ev.m), when, ev.d, f); env(g, when, .022, .004, ev.d, .05); return; }
  if (k === 'pulse') { g.connect(musicBus); const f = filt('lowpass', 600, g); osc('sawtooth', mtof(ev.m), when, ev.d, f); env(g, when, .06, .005, ev.d, .06); return; }
  if (k === 'kick') { g.connect(musicBus); const o = osc('sine', 130, when, .35, g); o.frequency.exponentialRampToValueAtTime(42, when + .25); g.gain.setValueAtTime(.4, when); g.gain.exponentialRampToValueAtTime(.001, when + .32); return; }
  if (k === 'snare') { g.connect(musicBus); noise(when, .2, filt('bandpass', 1800, g, .8)); g.gain.setValueAtTime(.12, when); g.gain.exponentialRampToValueAtTime(.001, when + .18); return; }
  if (k === 'shaker') { g.connect(musicBus); noise(when, .08, filt('highpass', 6000, g)); g.gain.setValueAtTime(ev.v, when); g.gain.exponentialRampToValueAtTime(.001, when + .07); return; }
  // эффекты
  g.connect(sfxBus);
  if (k === 'amb' || k === 'wind') {
    const d = ev.d - offset, f = filt(ev.hp ? 'highpass' : 'lowpass', ev.f || 600, g);
    const s = noise(when, d, f, offset); live.push(s);
    const v = k === 'wind' ? .06 : ev.v;
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(v, when + Math.min(1.5, d / 3)); g.gain.setValueAtTime(v, when + d - 1); g.gain.linearRampToValueAtTime(0, when + d);
    if (k === 'wind' || ev.lfo) { const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = k === 'wind' ? .3 : ev.lfo; lg.gain.value = k === 'wind' ? 500 : (ev.f || 600) * .5; lfo.connect(lg); lg.connect(f.frequency); lfo.start(when); lfo.stop(when + d); live.push(lfo); }
    return;
  }
  if (k === 'bird') { const o = osc('sine', ev.f, when, .25, g); o.frequency.setValueAtTime(ev.f, when); o.frequency.exponentialRampToValueAtTime(ev.f * 1.4, when + .06); o.frequency.exponentialRampToValueAtTime(ev.f * .9, when + .14); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(.025, when + .02); g.gain.exponentialRampToValueAtTime(.001, when + .2); g.connect(verbIn); return; }
  if (k === 'roar') {
    const ws = AC.createWaveShaper(), curve = new Float32Array(1024); for (let i = 0; i < 1024; i++) { const x = i / 512 - 1; curve[i] = Math.tanh(x * 4); } ws.curve = curve;
    const f = filt('lowpass', 900, g); ws.connect(f);
    for (const [fr, det] of [[95, 0], [97, 30], [48, 0]]) { const o = osc('sawtooth', fr, when, 1.8, ws); o.detune.value = det; o.frequency.linearRampToValueAtTime(fr * .62, when + 1.7); }
    noise(when, 1.8, filt('bandpass', 500, ws, .6));
    g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(.32, when + .12); g.gain.linearRampToValueAtTime(.25, when + 1); g.gain.exponentialRampToValueAtTime(.001, when + 1.8);
    g.connect(verbIn); return;
  }
  if (k === 'whoosh') { const f = filt('bandpass', 400, g, .7); f.frequency.setValueAtTime(300, when); f.frequency.exponentialRampToValueAtTime(1600, when + .5); f.frequency.exponentialRampToValueAtTime(200, when + 1.2); noise(when, 1.3, f); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(ev.v, when + .4); g.gain.exponentialRampToValueAtTime(.001, when + 1.25); return; }
  if (k === 'flap') { noise(when, .35, filt('lowpass', 380, g)); g.gain.setValueAtTime(0, when); g.gain.linearRampToValueAtTime(.4, when + .06); g.gain.exponentialRampToValueAtTime(.001, when + .32); return; }
  if (k === 'crackle') { noise(when, .03, filt('highpass', 2500, g)); g.gain.setValueAtTime(.08, when); g.gain.exponentialRampToValueAtTime(.001, when + .03); return; }
}
function startAudio(from) {
  ensureAC(); AC.resume();
  buildGraph();
  tStart = from; acStart = AC.currentTime + .06;
  evIdx = 0; while (evIdx < EVENTS.length && EVENTS[evIdx].t < from) evIdx++;
  // уже звучащие длинные события: реплики и эмбиент
  for (const ev of EVENTS) {
    if (ev.t >= from) break;
    if (ev.k === 'voice') { const v = VMAP[ev.id]; if (from < ev.t + v.dur - .1) play(ev, acStart, from - ev.t); }
    if ((ev.k === 'amb' || ev.k === 'wind') && from < ev.t + ev.d - .5) play(ev, acStart, from - ev.t);
  }
  schedule(); clearInterval(schedTimer); schedTimer = setInterval(schedule, 40);
}
function schedule() {
  if (!playing) return;
  const horizon = curTime() + .6;
  while (evIdx < EVENTS.length && EVENTS[evIdx].t < horizon) { const ev = EVENTS[evIdx++]; play(ev, Math.max(AC.currentTime, at(ev.t))); }
}
function stopAudio() {
  clearInterval(schedTimer);
  if (!master) return;
  const m = master; master = null;
  m.gain.setTargetAtTime(0, AC.currentTime, .03);
  for (const s of live) try { s.stop(AC.currentTime + .15); } catch (e) { }
  live = [];
  setTimeout(() => m.disconnect(), 300);
}

// =====================================================================
//  Загрузка озвучки (+ огибающая для синхронизации губ)
// =====================================================================
async function loadVoices() {
  ensureAC();
  await Promise.all(VOICE.map(async v => {
    const res = await fetch(`../voice/${v.id}.mp3`); const ab = await res.arrayBuffer();
    v.buf = await new Promise((ok, err) => AC.decodeAudioData(ab, ok, err));
    v.dur = v.buf.duration;
    const d = v.buf.getChannelData(0), win = Math.floor(v.buf.sampleRate / ENV_RATE), n = Math.ceil(d.length / win), e = new Float32Array(n);
    let mx = 0;
    for (let i = 0; i < n; i++) { let s = 0; for (let j = i * win; j < Math.min(d.length, (i + 1) * win); j++) s += d[j] * d[j]; e[i] = Math.sqrt(s / win); mx = Math.max(mx, e[i]); }
    for (let i = 0; i < n; i++) e[i] = clamp((e[i] / mx - .08) * 1.6);
    v.env = e;
  }));
}

// =====================================================================
//  Плеер
// =====================================================================
let t = 0, recorder = null, seekTimer = 0, ready = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function curTime() { return playing ? tStart + (AC.currentTime - acStart) : t; }
function ui() {
  $('btnPlay').textContent = playing ? '⏸ Пауза' : '▶ Пуск';
  $('btnSound').textContent = soundOn ? '🔊 Звук' : '🔇 Без звука';
  $('btnRec').textContent = recorder ? '⏺ Запись…' : '🎬 Скачать видео';
  $('btnRec').disabled = !!recorder || !ready;
  $('bigPlay').hidden = playing || t > .05;
}
function playIt() { if (!ready) return; if (t >= DUR - .05) t = 0; playing = true; startAudio(t); ui(); }
function pause() { if (playing) t = clamp(curTime(), 0, DUR); playing = false; stopAudio(); if (recorder && recorder.state === 'recording') recorder.stop(); ui(); }
function toggle() { playing ? pause() : playIt(); }
function seek(x) {
  const was = playing; if (playing) { playing = false; stopAudio(); }
  t = clamp(x, 0, DUR);
  if (was) { clearTimeout(seekTimer); seekTimer = setTimeout(playIt, 120); }
  ui();
}
async function record() {
  if (recorder || !ready) return;
  if (!window.MediaRecorder || !cv.captureStream) { alert('Этот браузер не умеет записывать видео с canvas. Попробуй Chrome.'); return; }
  const types = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'];
  const mime = types.find(m => MediaRecorder.isTypeSupported(m)) || '';
  ensureAC(); await AC.resume();
  pause();
  recDest = AC.createMediaStreamDestination();
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 10e6 } : {});
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);
  recorder.onstop = () => {
    const type = recorder.mimeType || 'video/webm', a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob(chunks, { type }));
    a.download = 'princessa-i-drakon.' + (type.includes('mp4') ? 'mp4' : 'webm'); a.click();
    recorder = null; recDest = null; ui();
  };
  t = 0; render(0); recorder.start(); playIt();
}
function loop() {
  if (playing) { t = curTime(); if (t >= DUR) { t = DUR; pause(); } }
  render(Math.min(Math.max(t, 0), DUR - .001));
  const sc = $('scrub'); if (document.activeElement !== sc || playing) sc.value = t;
  $('time').textContent = `${fmt(t)} / ${fmt(DUR)}`;
  requestAnimationFrame(loop);
}
$('bigPlay').onclick = playIt; cv.onclick = toggle; $('btnPlay').onclick = toggle;
$('btnRestart').onclick = () => { seek(0); if (!playing) setTimeout(playIt, 130); };
$('scrub').oninput = e => seek(+e.target.value);
$('btnSound').onclick = () => { soundOn = !soundOn; if (mon) mon.gain.value = soundOn ? 1 : 0; ui(); };
$('btnRec').onclick = record;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight') seek(curTime() + 5);
  if (e.code === 'ArrowLeft') seek(curTime() - 5);
});
const hm = location.hash.match(/t=([\d.]+)/); if (hm) t = +hm[1];
ui(); requestAnimationFrame(loop);
loadVoices().then(() => { ready = true; $('bigPlay').disabled = false; $('bigLabel').textContent = '▶ Смотреть сказку'; ui(); })
  .catch(err => { console.error(err); ready = true; $('bigPlay').disabled = false; $('bigLabel').textContent = '▶ Смотреть (без озвучки)'; ui(); });
</script>
