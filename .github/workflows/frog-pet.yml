name: Жабка — сборка для macOS

on:
  push:
    branches: ['**']
    tags: ['frog-v*']
    paths: ['frog-pet/**', '.github/workflows/frog-pet.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Тег релиза, например frog-v2.0.0 (пусто — только сборка)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  qa:
    name: 'QA: тесты, UI, e2e в Electron'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frog-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frog-pet/package-lock.json
      - run: npm ci
      - name: Юнит-тесты и фазз
        run: npm test
      - name: Playwright для UI-проверок (не в devDependencies)
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: UI-проверки в браузере
        run: npm run qa:ui
      - name: xvfb и библиотеки для Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgtk-3-0 libnss3 libgbm1 libasound2t64 libxss1
      - name: E2E в настоящем Electron
        run: npm run qa:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frog-qa-out
          path: frog-pet/qa/out
          if-no-files-found: warn

  build:
    needs: qa
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frog-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frog-pet/package-lock.json
      - run: npm ci
      - run: npm test
      - name: 'Сборка .dmg и .zip — Universal, Apple Silicon + Intel'
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Проверка подписи
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-universal/Zhabka.app
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Zhabka-macOS
          path: |
            frog-pet/dist/*.dmg
            frog-pet/dist/*.zip
          if-no-files-found: error
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/frog-v') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Жабка ${{ inputs.release_tag || github.ref_name }}
          files: |
            frog-pet/dist/*.dmg
            frog-pet/dist/*.zip
          body: |
            🐸 **Жабка** — питомец-программист для macOS.

            **Установка (macOS 12+, Apple Silicon и Intel):**
            1. Скачай `Zhabka-…-universal.dmg`, открой его и перетащи **Zhabka** в папку **Applications / Программы**. Запускай только оттуда, не из окна dmg и не из «Загрузок» (иначе не сработает автозапуск). Потом извлеки диск Zhabka в Finder.
            2. Приложение не подписано сертификатом Apple, поэтому первый запуск macOS заблокирует. Проще всего снять карантин в Терминале и запустить:
               ```
               xattr -dr com.apple.quarantine /Applications/Zhabka.app
               open /Applications/Zhabka.app
               ```
            3. Без Терминала:
               - **macOS 15 Sequoia и новее:** дважды кликни Жабку → в окне «Zhabka не открыто» нажми **Готово** → **Системные настройки → Конфиденциальность и безопасность** → внизу «Программа Zhabka заблокирована…» → **Всё равно открыть** → введи пароль → **Открыть**. Правый клик → «Открыть» на Sequoia больше не помогает.
               - **macOS 14 Sonoma и старше:** **правый клик по Жабке → Открыть → Открыть**.
            4. Окна нет в Dock — это нормально: жаба появится в правом нижнем углу, 🐸 — в меню-баре справа вверху (если не видно, меню-бар переполнен, освободи место). Разреши уведомления, когда macOS спросит. Если macOS сообщит «Добавлены объекты для входа» — это автозапуск Жабки, его можно выключить в её настройках.

            Если пишет «повреждено, переместите в корзину» — выполни команду из п. 2.
