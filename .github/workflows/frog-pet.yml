name: Жабка — сборка для macOS

on:
  push:
    branches: ['**']
    tags: ['frog-v*']
    paths: ['frog-pet/**', '.github/workflows/frog-pet.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: frog-pet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frog-pet/package-lock.json
      - run: npm ci
      - run: npm test
      - name: 'Сборка .dmg и .zip — Universal, Apple Silicon + Intel'
        run: npx electron-builder --mac --universal --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Проверка подписи
        run: |
          codesign --verify --deep --strict --verbose=2 dist/mac-universal/Zhabka.app
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: Zhabka-macOS
          path: |
            frog-pet/dist/*.dmg
            frog-pet/dist/*.zip
          if-no-files-found: error
      - name: Релиз
        if: startsWith(github.ref, 'refs/tags/frog-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Жабка ${{ github.ref_name }}
          files: |
            frog-pet/dist/*.dmg
            frog-pet/dist/*.zip
          body: |
            🐸 **Жабка** — питомец-программист для macOS.

            Скачай `.dmg`, перетащи Жабку в «Программы». Приложение не подписано сертификатом Apple, поэтому при первом запуске:
            **правый клик по Жабке → Открыть → Открыть**, либо в Терминале:
            ```
            xattr -cr /Applications/Zhabka.app
            ```
