<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Принцесса и Дракон — пиксельная сказка</title>
<meta name="description" content="Мультфильм в стиле пиксель-арта Марка Феррари: color cycling, дизеринг, озвучка и музыка — всё на чистом JavaScript.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0814;--panel:#17112a;--fg:#f3eaff;--accent:#ffd54a;--muted:#9a8fc2}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Pixelify Sans',monospace}
  body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
  .wrap{width:min(100%,calc((100vh - 110px)*16/9));display:flex;flex-direction:column;gap:12px}
  .stage{position:relative;width:100%;aspect-ratio:16/9;background:#000;border:4px solid #2a2048;box-shadow:0 0 0 4px #000,0 24px 60px #000a}
  canvas{display:block;width:100%;height:100%;image-rendering:pixelated;cursor:pointer}
  .big-play{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:9%;gap:12px;background:linear-gradient(transparent 45%,#000a);border:0;color:#fff;font:600 clamp(16px,2.4vw,26px) 'Pixelify Sans',monospace;cursor:pointer}
  .big-play .btn{background:var(--accent);color:#2a1830;padding:12px 26px;box-shadow:0 0 0 4px #2a1830,6px 6px 0 4px #000;font-size:clamp(18px,2.8vw,30px)}
  .big-play:hover .btn{transform:translateY(-2px)}
  .big-play[hidden]{display:none}
  .big-play:disabled{cursor:wait}
  .controls{display:flex;align-items:center;gap:8px;background:var(--panel);padding:10px 12px;border:3px solid #2a2048;flex-wrap:wrap}
  .controls button{background:#2c2552;color:var(--fg);border:0;padding:8px 12px;font:600 16px 'Pixelify Sans',monospace;cursor:pointer;box-shadow:inset 0 -3px 0 #0005}
  .controls button:hover{background:#3b3270}
  .controls button.rec{background:#7a2240}
  .controls button:disabled{opacity:.5;cursor:default}
  input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
  .time{font-variant-numeric:tabular-nums;color:var(--muted);min-width:96px;text-align:center}
  .hint{color:var(--muted);font-size:14px;text-align:center}
  .hint a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <canvas id="cv"></canvas>
    <button class="big-play" id="bigPlay" disabled><span class="btn" id="bigLabel">Загрузка…</span></button>
  </div>
  <div class="controls">
    <button id="btnPlay">▶ Пуск</button>
    <button id="btnRestart" title="С начала">⏮</button>
    <input type="range" id="scrub" min="0" max="135" step="0.01" value="0">
    <span class="time" id="time">0:00 / 2:15</span>
    <button id="btnSound">🔊 Звук</button>
    <button id="btnRec" class="rec">🎬 Скачать видео</button>
  </div>
  <div class="hint">Пробел — пауза · ← → — перемотка · картинка, анимация и музыка генерируются кодом в реальном времени (палитра 256 цветов, color cycling в духе Марка Феррари)</div>
</div>

<script>
'use strict';
// =====================================================================
//  Экран: 320×180 в индексных цветах → палитра → апскейл ×4
// =====================================================================
const VW = 320, VH = 180, SC = 4, W = VW * SC, H = VH * SC, DUR = 135;
const $ = id => document.getElementById(id);
const cv = $('cv'); cv.width = W; cv.height = H;
const ctx = cv.getContext('2d'); ctx.imageSmoothingEnabled = false;
const low = document.createElement('canvas'); low.width = VW; low.height = VH;
const lctx = low.getContext('2d');
const img = lctx.createImageData(VW, VH), img32 = new Uint32Array(img.data.buffer);
const FB = Buf(VW, VH), SP = Buf(VW, VH);
const fb = FB.d;

function Buf(w, h) { return { w, h, d: new Uint8Array(w * h) }; }
const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map(v => (v + .5) / 16);
const bay = (x, y) => BAY[(y & 3) * 4 + (x & 3)];
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, k) => a + (b - a) * k;
const prog = (a, b, x) => clamp((x - a) / (b - a));
const eio = k => k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
const sstep = (a, b, x) => { const k = prog(a, b, x); return k * k * (3 - 2 * k); };
const range = (s, n) => Array.from({ length: n }, (_, i) => s + i);
const PI = Math.PI;

function hash2(x, y) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash2(xi, yi), b = hash2(xi + 1, yi), c = hash2(xi, yi + 1), d = hash2(xi + 1, yi + 1);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, o = 4) {
  let s = 0, a = .5, f = 1, n = 0;
  for (let i = 0; i < o; i++) { s += a * vnoise(x * f + i * 17.3, y * f); n += a; f *= 2; a *= .5; }
  return s / n;
}

// =====================================================================
//  Палитра: индексы
// =====================================================================
const INK = 1, SKIN = [3, 2, 4], HAIR = [6, 5, 7], DRESS = [9, 8, 10], WHITE = 11, GOLD = [13, 12],
  EYE = 14, METAL = 15, DR = [17, 16, 18], BELLY = [20, 19], WING = [22, 21], HORN = [24, 23],
  DEYE = 25, MOUTH = 26, TOOTH = 27, SASH = [29, 28], LGLASS = 30, SMOKE = 31;
const SKY = range(32, 16), WA = 48, WB = 56, FALL = 64, FIRE = 72, STAR = 80, GLOW = 88, AUR = 96, RAY = 104;
const TF = range(112, 4), TM = range(116, 4), TN = range(120, 4), TX = range(124, 4);
const GR = range(128, 4), LF = range(132, 4), TR = range(136, 4), DT = range(140, 4);
const ST = range(144, 8), ST2 = range(152, 8), CL = range(160, 8), CL2 = range(168, 8);
const EX = 176, FLAME = 184, WARM = 188;

const CHAR_COLS = ['#f4c4a0', '#c98a74', '#ffe2c8', '#94704c', '#5a4030', '#c09a70', '#d8508a', '#8e2a5e', '#ff90ba',
  '#fff8ec', '#ffd54a', '#b88020', '#2a1830', '#7a7a90', '#3a9a78', '#1f5a50', '#86d8a0', '#f2dc96', '#b8935a',
  '#e8763e', '#a03c30', '#f4ead0', '#a89880', '#ffdc3c', '#7a1828', '#ffffff', '#5a8ae0', '#2c4a9a', '#ffe6a0', '#c8c0d8'];
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
function keys(P, start, n, cols) {
  const c = cols.map(hex);
  for (let i = 0; i < n; i++) {
    const f = n === 1 ? 0 : i / (n - 1) * (c.length - 1), a = Math.floor(f), b = Math.min(c.length - 1, a + 1), k = f - a;
    for (let ch = 0; ch < 3; ch++) P[(start + i) * 3 + ch] = c[a][ch] + (c[b][ch] - c[a][ch]) * k;
  }
}
function list(P, start, cols) { cols.forEach((h, i) => P.set(hex(h), (start + i) * 3)); }
function makePal(fn) {
  const P = new Float32Array(768);
  list(P, 0, ['#000000', '#140a18']); list(P, 2, CHAR_COLS);
  list(P, FLAME, ['#a01808', '#f05010', '#ffb020', '#fff4c0']);
  fn(P); return P;
}
function cycle(P, s, n, shift) {
  const tmp = new Float32Array(n * 3);
  shift = ((shift % n) + n) % n;
  const i0 = Math.floor(shift), fr = shift - i0;
  for (let k = 0; k < n; k++) {
    const a = (k + i0) % n, b = (k + i0 + 1) % n;
    for (let ch = 0; ch < 3; ch++) tmp[k * 3 + ch] = P[(s + a) * 3 + ch] * (1 - fr) + P[(s + b) * 3 + ch] * fr;
  }
  P.set(tmp, s * 3);
}

// =====================================================================
//  Примитивы растеризации (рисуют в текущий буфер T)
// =====================================================================
let T = FB;
function px(x, y, c) { x = Math.floor(x); y = Math.floor(y); if (x >= 0 && y >= 0 && x < T.w && y < T.h) T.d[y * T.w + x] = c; }
function get(x, y) { x = Math.floor(x); y = Math.floor(y); return (x >= 0 && y >= 0 && x < T.w && y < T.h) ? T.d[y * T.w + x] : 0; }
function span(y, x0, x1, c) {
  y = Math.floor(y); if (y < 0 || y >= T.h) return;
  const a = Math.max(0, Math.round(x0)), b = Math.min(T.w, Math.round(x1)), row = y * T.w;
  if (a >= b) return;
  if (typeof c === 'number') T.d.fill(c, row + a, row + b);
  else for (let x = a; x < b; x++) { const v = c(x, y); if (v) T.d[row + x] = v; }
}
function rect(x, y, w, h, c) { for (let j = Math.floor(y); j < Math.floor(y + h); j++) span(j, x, x + w, c); }
function ellipse(cx, cy, rx, ry, c) {
  if (rx <= 0 || ry <= 0) return;
  for (let y = Math.floor(cy - ry); y <= Math.ceil(cy + ry); y++) {
    const dy = (y + .5 - cy) / ry; if (dy <= -1 || dy >= 1) continue;
    const hw = rx * Math.sqrt(1 - dy * dy); span(y, cx - hw, cx + hw, c);
  }
}
function poly(pts, c) {
  let y0 = 1e9, y1 = -1e9;
  for (const p of pts) { y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
  for (let y = Math.floor(y0); y <= Math.ceil(y1); y++) {
    const yc = y + .5, xs = [];
    for (let i = 0, n = pts.length; i < n; i++) {
      const [ax, ay] = pts[i], [bx, by] = pts[(i + 1) % n];
      if ((ay <= yc && by > yc) || (by <= yc && ay > yc)) xs.push(ax + (yc - ay) / (by - ay) * (bx - ax));
    }
    xs.sort((a, b) => a - b);
    for (let k = 0; k + 1 < xs.length; k += 2) span(y, xs[k], xs[k + 1], c);
  }
}
function line(x0, y0, x1, y1, c) {
  x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy;
  for (let i = 0; i < 400; i++) {
    px(x0, y0, c); if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
function rampAt(r, f, x, y) {
  const n = r.length; if (n === 1) return r[0];
  f = clamp(f, 0, .9999); const v = f * (n - 1), i = Math.floor(v);
  return r[(i + 1 < n && v - i > bay(x, y)) ? i + 1 : i];
}
let LIGHT = { x: -.6, y: -.8 };
function lit(ramp, cx, cy, rx, ry, bias = 0) {
  return (x, y) => rampAt(ramp, .5 + bias + (((x + .5 - cx) / rx) * LIGHT.x + ((y + .5 - cy) / ry) * LIGHT.y) * .55, x, y);
}
function bez(p0, p1, p2, n = 16) {
  const r = [];
  for (let i = 0; i <= n; i++) { const k = i / n, a = (1 - k) * (1 - k), b = 2 * (1 - k) * k, c = k * k; r.push([a * p0[0] + b * p1[0] + c * p2[0], a * p0[1] + b * p1[1] + c * p2[1]]); }
  return r;
}

// ----- Локальная система координат для персонажей (масштаб, отражение) -----
let O = { x: 0, y: 0, s: 1, f: 1 };
const X = x => O.x + x * O.s * O.f, Y = y => O.y + y * O.s;
function E(cx, cy, rx, ry, c, edge) {
  const sx = X(cx), sy = Y(cy), a = Math.max(.5, rx * O.s), b = Math.max(.5, ry * O.s);
  if (edge) ellipse(sx, sy, a + 1, b + 1, edge);
  ellipse(sx, sy, a, b, Array.isArray(c) ? lit(c, sx, sy, a, b) : c);
}
function Pg(pts, c, edge) {
  const sp = pts.map(p => [X(p[0]), Y(p[1])]);
  if (edge) for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) poly(sp.map(p => [p[0] + dx, p[1] + dy]), edge);
  let fill = c;
  if (Array.isArray(c)) {
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of sp) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); }
    fill = lit(c, (x0 + x1) / 2, (y0 + y1) / 2, Math.max(1, (x1 - x0) / 2), Math.max(1, (y1 - y0) / 2));
  }
  poly(sp, fill);
}
function Ch(pts, r0, r1, c, edge) {
  const samp = [];
  let total = 0; const seg = [];
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); seg.push(l); total += l; }
  const step = Math.max(.25, .6 / O.s);
  let acc = 0;
  for (let i = 1; i < pts.length; i++) {
    const [ax, ay] = pts[i - 1], [bx, by] = pts[i];
    for (let d = 0; d < seg[i - 1]; d += step) { const k = d / seg[i - 1], tt = (acc + d) / total; samp.push([ax + (bx - ax) * k, ay + (by - ay) * k, lerp(r0, r1, tt)]); }
    acc += seg[i - 1];
  }
  const last = pts[pts.length - 1]; samp.push([last[0], last[1], r1]);
  if (edge) for (const [x, y, r] of samp) ellipse(X(x), Y(y), r * O.s + 1, r * O.s + 1, edge);
  for (const [x, y, r] of samp) { const sx = X(x), sy = Y(y), rr = r * O.s; ellipse(sx, sy, rr, rr, Array.isArray(c) ? lit(c, sx, sy, rr, rr) : c); }
  return samp;
}
const Ln = (x0, y0, x1, y1, c) => line(X(x0), Y(y0), X(x1), Y(y1), c);
const Px = (x, y, c) => px(X(x), Y(y), c);

function beginSprite() { SP.d.fill(0); T = SP; }
function endSprite(ink = INK) {
  const d = SP.d, w = VW, h = VH, mark = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const i = y * w + x; if (d[i]) continue;
    if ((x > 0 && d[i - 1]) || (x < w - 1 && d[i + 1]) || (y > 0 && d[i - w]) || (y < h - 1 && d[i + w])) mark.push(i);
  }
  for (const i of mark) d[i] = ink;
  for (let i = 0; i < d.length; i++) if (d[i]) fb[i] = d[i];
  T = FB;
}
function blit(L, ox = 0, oy = 0, wrap = false) {
  ox = Math.round(ox); oy = Math.round(oy);
  for (let y = 0; y < VH; y++) {
    const sy = y + oy; if (sy < 0 || sy >= L.h) continue;
    const row = sy * L.w, out = y * VW;
    for (let x = 0; x < VW; x++) {
      let sx = x + ox;
      if (wrap) sx = ((sx % L.w) + L.w) % L.w; else if (sx < 0 || sx >= L.w) continue;
      const v = L.d[row + sx]; if (v) fb[out + x] = v;
    }
  }
}

// ----- Осветление по рампам: каждый индекс → следующий светлее в своей рампе -----
const LIGHTEN = new Uint8Array(256).map((_, i) => i);
for (const r of [SKY, TF, TM, TN, TX, GR, LF, TR, DT, ST, ST2, CL, CL2, SKIN, HAIR, DRESS, DR, BELLY, WING, HORN, SASH, GOLD, range(EX, 4)])
  for (let i = 0; i + 1 < r.length; i++) LIGHTEN[r[i]] = r[i + 1];
// мягкие лучи света: диагональные полосы, внутри которых пиксели светлеют (с дизерингом по краям)
function shafts(ox, period, width, yMax, strength, slope = .55, mask = null) {
  for (let y = 0; y < yMax; y++) for (let x = 0; x < VW; x++) {
    const p = (((x + ox) * slope + y) % period + period) % period;
    if (p > width) continue;
    const edge = Math.sin(p / width * PI), m = mask ? mask(x, y) : 1;
    const k = edge * strength * m * (1 - y / (yMax * 1.4)), d = bay(x, y);
    if (k > d) { const i = y * VW + x; fb[i] = LIGHTEN[fb[i]]; if (k > d + .55) fb[i] = LIGHTEN[fb[i]]; }
  }
}

// =====================================================================
//  Строительные блоки фонов
// =====================================================================
function skyGrad(y0, y1, ramp) {
  for (let y = Math.max(0, y0); y < Math.min(T.h, y1); y++) { const f = (y - y0) / (y1 - y0); span(y, 0, T.w, (x, yy) => rampAt(ramp, f, x, yy)); }
}
function starField(n, maxY, seed) {
  for (let i = 0; i < n; i++) {
    const x = Math.floor(hash2(i, seed) * T.w), y = Math.floor(hash2(i, seed + 1) * maxY), c = STAR + (i & 7);
    px(x, y, c);
    if (hash2(i, seed + 2) > .92) { px(x + 1, y, STAR + ((i + 3) & 7)); px(x - 1, y, STAR + ((i + 3) & 7)); px(x, y + 1, STAR + ((i + 3) & 7)); px(x, y - 1, STAR + ((i + 3) & 7)); }
  }
}
function glowAround(cx, cy, r0, r1, add, maxIdx, minIdx = 0, pow = 1.4) {
  for (let y = Math.floor(cy - r1); y <= cy + r1; y++) for (let x = Math.floor(cx - r1); x <= cx + r1; x++) {
    const d = Math.hypot(x + .5 - cx, y + .5 - cy); if (d < r0 || d > r1) continue;
    const k = Math.pow(1 - (d - r0) / (r1 - r0), pow), v = get(x, y);
    if (v >= minIdx && v < maxIdx && k > bay(x, y)) px(x, y, Math.min(maxIdx, v + add));
  }
}
function disc(cx, cy, r, c) { ellipse(cx, cy, r, r, c); }
function mountain(rf, ramp, o = {}) {
  const { light = 1, tex = .5, fade = .004, x0 = 0, x1 = T.w, yMax = T.h, seed = 0, snow = 0, bias = 0 } = o;
  for (let x = x0; x < x1; x++) {
    const r = rf(x), sl = rf(x + 1) - rf(x - 1);
    for (let y = Math.max(0, Math.floor(r)); y < yMax; y++) {
      const dd = y - r;
      let f = .5 + bias + clamp(sl * light * .22, -.35, .35) + (fbm(x * .11 + seed, y * .045, 3) - .5) * tex - dd * fade;
      if (snow && dd < snow * (.5 + vnoise(x * .3, seed))) f = .97;
      px(x, y, rampAt(ramp, f, x, y));
    }
  }
}
function cloud(cx, cy, w, h, ramp, seed, o = {}) {
  const { below = false, thr = .3, flat = .6 } = o;
  for (let y = Math.floor(cy - h); y < cy + h; y++) for (let x = Math.floor(cx - w); x < cx + w; x++) {
    const u = (x - cx) / w, v = (y - cy) / h;
    const n = fbm(x * .05 + seed, y * .1 + seed, 4);
    const m = n - (u * u + v * v) * .55 - (v > 0 ? v * flat : 0);
    if (m > thr) {
      const sh = below ? (v * .5 + .5) : (.55 - v * .5);
      px(x, y, rampAt(ramp, clamp(sh * .55 + (m - thr) * 1.8 + (n - .5) * .3), x, y));
    }
  }
}
function sea(y0, y1, sunX, reflW, seed = 0) {
  for (let y = y0; y < y1; y++) {
    const dep = (y - y0) / (y1 - y0);
    for (let x = 0; x < T.w; x++) {
      const n = vnoise(x * .045 / (.2 + dep) + seed, y * .8 + seed);
      const band = (Math.floor(n * 9 + y * .45)) & 7;
      let c = WA + band;
      if (sunX != null) { const rw = (1.5 + dep * reflW) * (.35 + vnoise(x * .2, y * 1.9)); if (Math.abs(x - sunX) < rw) c = WB + band; }
      T.d[y * T.w + x] = c;
    }
  }
}
function waterfall(x0, x1, y0, y1, spread = .08) {
  for (let y = y0; y < y1; y++) {
    const k = y - y0, a = x0 - k * spread, b = x1 + k * spread;
    for (let x = Math.floor(a); x < b; x++) px(x, y, FALL + ((y + Math.floor(hash2(x, 77) * 8)) & 7));
  }
}

const EVENTS = buildEvents();

let AC = null, master = null, mon = null, musicBus = null, sfxBus = null, verbIn = null, recDest = null, noiseBuf = null, impulse = null;
let playing = false, soundOn = true, tStart = 0, acStart = 0, evIdx = 0, schedTimer = 0, live = [];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function ensureAC() {

  noiseBuf = AC.createBuffer(1, AC.sampleRate * 2, AC.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;

function buildGraph() {

}
const at = t => acStart + (t - tStart);
function env(g, when, v, a, d, rel = .1) {

function schedule() {

  setTimeout(() => m.disconnect(), 300);

// =====================================================================
//  Загрузка озвучки (+ огибающая для синхронизации губ)
// =====================================================================
async function loadVoices() {
  ensureAC();
  await Promise.all(VOICE.map(async v => {
    const res = await fetch(`voice/${v.id}.mp3`); const ab = await res.arrayBuffer();
    v.buf = await new Promise((ok, err) => AC.decodeAudioData(ab, ok, err));

    const d = v.buf.getChannelData(0), win = Math.floor(v.buf.sampleRate / ENV_RATE), n = Math.ceil(d.length / win), e = new Float32Array(n);

    for (let i = 0; i < n; i++) { let s = 0; for (let j = i * win; j < Math.min(d.length, (i + 1) * win); j++) s += d[j] * d[j]; e[i] = Math.sqrt(s / win); mx = Math.max(mx, e[i]); }

// =====================================================================
//  Плеер
// =====================================================================
let t = 0, recorder = null, seekTimer = 0, ready = false;
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
function curTime() { return playing ? tStart + (AC.currentTime - acStart) : t; }
function ui() {
  $('btnPlay').textContent = playing ? '⏸ Пауза' : '▶ Пуск';
  $('btnSound').textContent = soundOn ? '🔊 Звук' : '🔇 Без звука';
  $('btnRec').textContent = recorder ? '⏺ Запись…' : '🎬 Скачать видео';
  $('btnRec').disabled = !!recorder || !ready;
  $('bigPlay').hidden = playing || t > .05;
}
function playIt() { if (!ready) return; if (t >= DUR - .05) t = 0; playing = true; startAudio(t); ui(); }

function toggle() { playing ? pause() : playIt(); }
function seek(x) {

async function record() {
  if (recorder || !ready) return;

  pause();
  recDest = AC.createMediaStreamDestination();
  const stream = new MediaStream([...cv.captureStream(30).getVideoTracks(), ...recDest.stream.getAudioTracks()]);
  const chunks = [];
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 10e6 } : {});
  recorder.ondataavailable = e => e.data.size && chunks.push(e.data);

    const type = recorder.mimeType || 'video/webm', a = document.createElement('a');

    a.download = 'princessa-i-drakon.' + (type.includes('mp4') ? 'mp4' : 'webm'); a.click();

}
function loop() {
  if (playing) { t = curTime(); if (t >= DUR) { t = DUR; pause(); } }

$('bigPlay').onclick = playIt; cv.onclick = toggle; $('btnPlay').onclick = toggle;
$('btnRestart').onclick = () => { seek(0); if (!playing) setTimeout(playIt, 130); };
$('scrub').oninput = e => seek(+e.target.value);
$('btnSound').onclick = () => { soundOn = !soundOn; if (mon) mon.gain.value = soundOn ? 1 : 0; ui(); };
$('btnRec').onclick = record;
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); toggle(); }
  if (e.code === 'ArrowRight') seek(curTime() + 5);
  if (e.code === 'ArrowLeft') seek(curTime() - 5);
});
const hm = location.hash.match(/t=([\d.]+)/); if (hm) t = +hm[1];
ui(); requestAnimationFrame(loop);
loadVoices().then(() => { ready = true; $('bigPlay').disabled = false; $('bigLabel').textContent = '▶ Смотреть сказку'; ui(); })
  .catch(err => { console.error(err); ready = true; $('bigPlay').disabled = false; $('bigLabel').textContent = '▶ Смотреть (без озвучки)'; ui(); });
</script>
